$kind: http-request
method: GET
url: '{{base_url}}/health'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Gateway health endpoint returns HTTP 200', () => {
        pm.response.to.have.status(200);
      });

      pm.test('Service reports UP status and expected gateway identifier', () => {
        const body = pm.response.json();
        pm.expect(body.status).to.eql('UP');
        pm.expect(body.service).to.eql('healthcare-ehr-hl7-edi-gateway');
      });
