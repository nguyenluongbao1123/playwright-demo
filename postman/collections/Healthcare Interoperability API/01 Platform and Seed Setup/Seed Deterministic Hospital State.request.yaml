$kind: http-request
method: POST
url: '{{api_base_url}}/admin/seed'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "scope": "all",
      "samplePatient": {
        "mrn": "{{sample_mrn}}",
        "fullName": "Nguyen Van An",
        "dob": "1988-05-14",
        "gender": "M",
        "insurancePayerId": "{{payer_id}}"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Seed baseline resets hospital state with HTTP 200', () => {
        pm.response.to.have.status(200);
      });

      pm.test('MPI and inventory ledgers are initialized deterministically', () => {
        const body = pm.response.json();
        pm.expect(body.seeded).to.eql(true);
        pm.expect(body.patientCount).to.be.at.least(2);
        pm.expect(body.inventoryCount).to.eql(2);
      });
