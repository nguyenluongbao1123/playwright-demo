name: Healthcare Playwright Agentic QA

on:
  push:
    branches: [ prod, main, master, baonl-dev, develop ]
  pull_request:
    branches: [ prod, main, master, baonl-dev, develop ]
  workflow_dispatch:

jobs:
  healthcare-qa-gate:
    name: Typecheck + HL7/EDI API + Clinical E2E
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    env:
      CI: "true"
      TEST_ENV: "ci-github-actions"
      FACILITY_CODE: "DN-HOSP-01"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Postman CLI
        run: npm install -g postman-cli

      - name: Install Chromium Browser & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: TypeScript & POM Strict Contract Gate
        run: npm run typecheck

      - name: Postman v3 Collection & Environment Lint Gate
        run: npm run postman:lint

      - name: Execute Postman v3 Healthcare API Collection
        run: |
          ./node_modules/.bin/tsx mocks/healthcare-server.ts &
          SERVER_PID=$!
          trap "kill -9 $SERVER_PID 2>/dev/null || true; fuser -k 4173/tcp 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/health >/dev/null && break
            sleep 0.5
          done
          postman collection run "postman/collections/Healthcare Interoperability API" \
            -e "postman/environments/Local Sandbox.environment.yaml" \
            --output test-results/postman-run \
            --no-report-events

      - name: Execute Seed, HL7/EDI Contract API & Clinical E2E Suites
        run: npm test

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit XML & Failure Traces
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: healthcare-junit-and-traces
          path: test-results/
          retention-days: 14
